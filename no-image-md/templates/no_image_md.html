<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无图MD</title>
<style>
:root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #15171a;
    --muted: #6f7682;
    --line: #e4e7ec;
    --blue: #2f5bff;
    --blue-soft: #eef2ff;
    --danger: #c24141;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
}
button, input { font: inherit; }
.page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: 66px 1fr;
}
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
    background: #fff;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 850;
}
.brand-mark {
    width: 24px;
    height: 24px;
    border: 3px solid #111;
    border-top-color: transparent;
    border-radius: 0 0 16px 16px;
    transform: rotate(-10deg);
}
.nav { display: flex; gap: 10px; }
.nav a {
    height: 38px;
    display: inline-flex;
    align-items: center;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--blue);
    background: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 800;
}
.workspace {
    min-width: 0;
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
}
.panel { min-width: 0; background: #fff; }
.left {
    border-right: 1px solid var(--line);
    padding: 28px;
}
.right {
    display: grid;
    grid-template-rows: 62px 1fr;
}
.panel-title {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 850;
}
.hint {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}
.dropzone {
    min-height: 180px;
    display: grid;
    place-items: center;
    padding: 22px;
    border: 1.5px dashed #b7c0d1;
    border-radius: 16px;
    background: #fbfcff;
    cursor: pointer;
    text-align: center;
}
.dropzone input { display: none; }
.file-name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 17px;
    font-weight: 800;
}
.file-desc {
    display: block;
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
}
.primary, .download {
    width: 100%;
    height: 44px;
    margin-top: 18px;
    border: 0;
    border-radius: 10px;
    color: #fff;
    background: var(--blue);
    cursor: pointer;
    font-weight: 850;
}
.primary:disabled {
    color: #9aa2af;
    background: #e2e6ee;
    cursor: not-allowed;
}
.download {
    display: none;
    text-decoration: none;
    text-align: center;
    line-height: 44px;
}
.result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
}
.result-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 19px;
    font-weight: 850;
}
.result-body {
    min-height: 0;
    padding: 28px;
    overflow: auto;
    background: #f2f3f5;
}
pre {
    min-height: calc(100vh - 150px);
    margin: 0;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    white-space: pre-wrap;
    word-break: break-word;
    color: #20242a;
    font-size: 15px;
    line-height: 1.9;
}
.markdown-body {
    min-height: calc(100vh - 150px);
    margin: 0;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: #20242a;
    font-size: 16px;
    line-height: 1.88;
}
.markdown-body h1,
.markdown-body h2,
.markdown-body h3 {
    margin: 28px 0 14px;
    line-height: 1.35;
}
.markdown-body h1 { font-size: 28px; }
.markdown-body h2 { font-size: 23px; }
.markdown-body h3 { font-size: 19px; }
.markdown-body p { margin: 0 0 16px; }
.markdown-body ul,
.markdown-body ol {
    margin: 0 0 16px 24px;
    padding: 0;
}
.markdown-body table {
    width: max-content;
    min-width: 100%;
    margin: 0 0 20px;
    border-collapse: collapse;
    font-size: 14px;
}
.markdown-body th,
.markdown-body td {
    min-width: 110px;
    max-width: 360px;
    border: 1px solid #cbd5e1;
    padding: 10px;
    vertical-align: top;
    word-break: break-word;
}
.markdown-body th {
    background: #f1f5f9;
    font-weight: 800;
}
.markdown-body code {
    padding: 2px 5px;
    border-radius: 5px;
    background: #eef0eb;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 13px;
}
.markdown-body pre {
    min-height: 0;
    margin: 0 0 16px;
    padding: 14px;
    overflow: auto;
}
.empty,
.error {
    min-height: 240px;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
}
.error { color: var(--danger); }
@media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="page">
    <header class="topbar">
        <div class="brand"><span class="brand-mark"></span><span>无图MD</span></div>
        <nav class="nav">
            <a href="/">文档解析</a>
            <a href="/compare-page">合同对比</a>
            <a href="/text-extract-page">文字提取</a>
        </nav>
    </header>
    <main class="workspace">
        <section class="panel left">
            <h1 class="panel-title">生成无图 Markdown</h1>
            <p class="hint">仅支持 PDF。上传后会调用 MinerU 解析成 Markdown，并移除所有图片引用，方便直接下载。</p>
            <label class="dropzone">
                <input type="file" id="fileInput" accept=".pdf">
                <span>
                    <span class="file-name" id="fileName">点击选择 PDF</span>
                    <span class="file-desc" id="fileDesc">仅支持 PDF 文件</span>
                </span>
            </label>
            <button class="primary" type="button" id="generateBtn" disabled>开始生成</button>
        </section>
        <section class="panel right">
            <div class="result-head">
                <span class="result-title" id="resultTitle">无图 Markdown</span>
                <a class="download" id="downloadBtn" href="#" download>下载 Markdown</a>
            </div>
            <div class="result-body" id="resultBody">
                <div class="empty">等待上传 PDF</div>
            </div>
        </section>
    </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fileInput = $("fileInput");
const generateBtn = $("generateBtn");
const downloadBtn = $("downloadBtn");
const resultBody = $("resultBody");
let currentMarkdown = "";
let busy = false;

fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    $("fileName").textContent = file ? file.name : "点击选择 PDF";
    $("fileDesc").textContent = file ? `${formatBytes(file.size)} · 准备生成` : "仅支持 PDF 文件";
    $("resultTitle").textContent = file ? file.name : "无图 Markdown";
    generateBtn.disabled = !file || busy;
});

generateBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    busy = true;
    generateBtn.disabled = true;
    downloadBtn.style.display = "none";
    resultBody.innerHTML = '<div class="empty">正在生成无图 Markdown</div>';

    const formData = new FormData();
    formData.append("file", file);
    try {
        const response = await fetch("/no-image-md", { method: "POST", body: formData });
        if (!response.ok) throw new Error(`服务返回 ${response.status}`);
        const result = await response.json();
        if (result.error) throw new Error(result.error);
        currentMarkdown = result.markdown || "";
        renderMarkdownPreview(currentMarkdown || "未生成内容");
        if (currentMarkdown) {
            const blob = new Blob([currentMarkdown], { type: "text/markdown;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            downloadBtn.href = url;
            downloadBtn.download = result.filename || "no_image.md";
            downloadBtn.style.display = "inline-block";
        }
    } catch (error) {
        currentMarkdown = "";
        resultBody.innerHTML = `<div class="error">${escapeHtml(error.message || "生成失败")}</div>`;
    } finally {
        busy = false;
        generateBtn.disabled = !fileInput.files[0];
    }
});

function formatBytes(bytes) {
    if (!bytes) return "-";
    const units = ["B", "KB", "MB", "GB"];
    const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    return `${(bytes / Math.pow(1024, index)).toFixed(index ? 1 : 0)}${units[index]}`;
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderMarkdownPreview(markdown) {
    resultBody.innerHTML = `<div class="markdown-body">${markdownToHtml(markdown)}</div>`;
}

function markdownToHtml(markdown) {
    const lines = String(markdown || "").split(/\r?\n/);
    const html = [];
    let inCode = false;
    let listType = null;
    let paragraph = [];

    const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
    };

    const closeList = () => {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = null;
    };

    for (let i = 0; i < lines.length; i++) {
        const raw = lines[i];
        const line = raw.trim();

        if (line.startsWith("```")) {
            flushParagraph();
            closeList();
            html.push(inCode ? "</code></pre>" : "<pre><code>");
            inCode = !inCode;
            continue;
        }

        if (inCode) {
            html.push(escapeHtml(raw) + "\n");
            continue;
        }

        if (!line) {
            flushParagraph();
            closeList();
            continue;
        }

        if (isTableStart(lines, i)) {
            flushParagraph();
            closeList();
            const headers = splitTableRow(lines[i]);
            i += 1;
            const rows = [];
            while (i + 1 < lines.length && lines[i + 1].trim().startsWith("|")) {
                rows.push(splitTableRow(lines[i + 1]));
                i += 1;
            }
            html.push(renderTable(headers, rows));
            continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
            flushParagraph();
            closeList();
            const level = Math.min(heading[1].length, 3);
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
        }

        const unordered = line.match(/^[-*]\s+(.+)$/);
        if (unordered) {
            flushParagraph();
            if (listType !== "ul") {
                closeList();
                listType = "ul";
                html.push("<ul>");
            }
            html.push(`<li>${inlineMarkdown(unordered[1])}</li>`);
            continue;
        }

        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (ordered) {
            flushParagraph();
            if (listType !== "ol") {
                closeList();
                listType = "ol";
                html.push("<ol>");
            }
            html.push(`<li>${inlineMarkdown(ordered[1])}</li>`);
            continue;
        }

        if (/^<\/?(table|thead|tbody|tr|td|th|br|hr|div|span|p)\b/i.test(line)) {
            flushParagraph();
            closeList();
            html.push(raw);
            continue;
        }

        paragraph.push(line);
    }

    flushParagraph();
    closeList();
    if (inCode) html.push("</code></pre>");
    return html.join("\n") || '<div class="empty">Markdown 内容为空</div>';
}

function inlineMarkdown(text) {
    if (/<[a-zA-Z][\s\S]*?>/.test(text)) return text;
    return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function isTableStart(lines, index) {
    const current = lines[index]?.trim() || "";
    const next = lines[index + 1]?.trim() || "";
    return current.startsWith("|") && next.startsWith("|") && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(next);
}

function splitTableRow(row) {
    return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
}

function renderTable(headers, rows) {
    const head = headers.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("");
    const body = rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("");
    return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
</script>
</body>
</html>
